apiVersion: v1
kind: Service
metadata:
  name: confighub-api
  namespace: confighub
  labels:
    app: confighub
spec:
  # Stated rather than left to default to it, so that switching to a NodePort is
  # a change to this line instead of an addition. A NodePort is how a local
  # cluster becomes reachable on localhost -- kind publishes it to the host with
  # extraPortMappings -- which beats a port-forward that dies with its terminal.
  type: ClusterIP
  ports:
  - name: http
    port: 9090
    targetPort: 9090
  selector:
    app: confighub
---
apiVersion: v1
kind: Service
metadata:
  name: confighub-oci-server
  namespace: confighub
  labels:
    app: confighub
spec:
  type: ClusterIP
  ports:
  - name: oci
    port: 9092
    targetPort: 9092
  selector:
    app: confighub
