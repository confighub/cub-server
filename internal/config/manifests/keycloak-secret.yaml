# Keycloak's own credentials. Nothing here is read by the ConfigHub server.
#
# DO NOT COMMIT. Apply it and keep it somewhere that is not a git repository.
#
# Separate from the server's Secret on purpose. The server's Deployment consumes
# that one whole, with envFrom, so every key in it is in the server's environment
# whether the server reads it or not. What is in here must not be: it is an admin
# of Keycloak's master realm, which is authority over every realm, and leaving it
# within reach of the workload whose identity provider it controls would undo the
# reason that workload authenticates with a key.
#
# This one is read by a single secretKeyRef in the Keycloak StatefulSet.
apiVersion: v1
kind: Secret
metadata:
  name: confighub-keycloak-secret
  namespace: confighub
type: Opaque
# Filled from the variable table in internal/config.
stringData:
