# Secret configuration.
#
# DO NOT COMMIT. Apply it and keep it somewhere that is not a git repository.
#
# A deployment that manages secrets elsewhere can populate a Secret of this name
# from its own secret manager and delete this file; the Deployment reads it with
# envFrom either way and cannot tell the difference.
#
# stringData rather than data: base64 is not encryption and obscuring these
# would only make them harder to review. Kubernetes stores them identically.
#
# POSTGRES_PASSWORD is here for the bundled database container to read, not for
# the server; it reaches Postgres through a secretKeyRef into this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: confighub-secret-env
  namespace: confighub
type: Opaque
# Filled from the variable table in internal/config. Which keys appear
# depends on the install -- a bundled database contributes POSTGRES_PASSWORD and
# an external one does not -- which is the other reason they are not listed here.
stringData:
