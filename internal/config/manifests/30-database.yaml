# Bundled PostgreSQL.
#
# For evaluation and CI. A long-lived install should point at a managed database
# with --database=external and let something else own backups and upgrades.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: confighub-postgres
  namespace: confighub
spec:
  serviceName: confighub-postgres
  replicas: 1
  selector:
    matchLabels:
      app: confighub-postgres
  template:
    metadata:
      labels:
        app: confighub-postgres
    spec:
      # Meets the Pod Security Standards "restricted" level, which clusters that
      # enforce it apply to every namespace. 70 is the postgres user of the
      # alpine image; the entrypoint, started as that user rather than root,
      # skips the chown it would otherwise need, and fsGroup makes the volume
      # writable to it.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
      - name: postgres
        image: postgres:17-alpine
        # Postgres writes only to its data directory and to /var/run/postgresql,
        # where it keeps its socket and lock file.
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: POSTGRES_DB
          value: confighub
        - name: POSTGRES_USER
          value: confighub
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: confighub-secret-env
              key: POSTGRES_PASSWORD
        # The mount contains lost+found, which Postgres refuses to initialise
        # into, so the data directory is a subdirectory of it.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: run
          mountPath: /var/run/postgresql
      volumes:
      - name: run
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    # No storageClassName unless --storage-class names one, so the cluster's default
    # StorageClass provisions the volume. On a cluster with no default, such as
    # EKS Auto Mode, the claim stays Pending and Postgres never starts: name a
    # class with --storage-class, or set storageClassName here.
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: confighub-postgres
  namespace: confighub
  labels:
    app: confighub-postgres
spec:
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  selector:
    app: confighub-postgres
