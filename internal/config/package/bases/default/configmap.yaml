# The server's environment, but for its secrets, which are in the
# confighub-secret-env Secret. Nothing here is secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: confighub-env
  namespace: confighubplaceholder
data:
  # Where the browser reaches the web UI. Advertised in /api/info so clients
  # can link to it. The installer's ui_url input.
  CONFIGHUB_UI_URL: confighubplaceholder
  # Public JWK of the bootstrap administrator, which the server reads at
  # startup. Not secret: the private half never reaches the cluster. The
  # installer's admin_jwk input.
  CONFIGHUB_LOCAL_ADMIN_JWK: confighubplaceholder
  # Where clients, such as Argo CD in another cluster, reach the OCI registry,
  # like https://oci.example.com. The server advertises it in /api/info, and
  # the registry's token realm follows it. Empty, which the server reads as
  # unset, leaves the server to work the address out from each request; set
  # it behind a load balancer that terminates TLS without forwarded headers,
  # or for a registry on a name other than oci.<API host>. Not a placeholder:
  # the server refuses to start with anything but a URL here. The installer's
  # oci_url input.
  OCI_EXTERNAL_URL: ""
---
# The UI's environment. Two ConfigMaps rather than one, so that a value only
# the UI reads restarts the UI and leaves the server running.
apiVersion: v1
kind: ConfigMap
metadata:
  name: confighub-ui-env
  namespace: confighubplaceholder
data:
  # Where the browser reaches the ConfigHub API. The UI is served from a
  # different origin. The installer's api_url input.
  CONFIGHUB_URL: confighubplaceholder
