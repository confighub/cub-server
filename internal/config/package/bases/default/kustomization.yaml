apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - ui.yaml
  - services.yaml
# Override with installer setup --set-image <name>=<image>, for a mirror.
images:
  - name: ghcr.io/confighubai/confighub
    newName: ghcr.io/confighubai/confighub
    newTag: v0.11.2
  - name: ghcr.io/confighub/ui
    newName: ghcr.io/confighub/ui
    newTag: v0.11.2
