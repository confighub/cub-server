# Renamed to the install namespace. Admission rejects any pod in it that does
# not meet the Pod Security Standards "restricted" level; every workload here
# does. In the first sync wave, since everything else is created in it.
apiVersion: v1
kind: Namespace
metadata:
  name: confighubplaceholder
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
