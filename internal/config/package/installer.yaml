apiVersion: installer.confighub.com/v1alpha1
kind: Package
metadata:
  name: confighub
installerMetadata:
  # The ConfigHub release the package runs: the server and the UI, which are
  # released together under one version.
  version: 0.11.2
  installerVersion: ">= 0.3.0"
spec:
  bases:
    - name: default
      path: bases/default
      default: true
      description: |
        The ConfigHub server, which migrates its database before it starts,
        and the web UI, each behind a ClusterIP Service. The server reads its
        secrets -- the token signing key and DATABASE_URL -- from the
        confighub-secret-env Secret, supplied out of band.

  components:
    - name: bundled-postgres
      path: components/bundled-postgres
      default: true
      description: |
        PostgreSQL in the install namespace, for evaluation. It reads its
        password from POSTGRES_PASSWORD in confighub-secret-env, which
        DATABASE_URL has to embed. Without it, DATABASE_URL names a database
        you run. Its volume comes from the cluster's default StorageClass,
        unless storage_class names one: a cluster with no default leaves the
        claim Pending.
      transformers:
        # Unset unless storage_class names a class: an empty storageClassName
        # asks for no dynamic provisioning at all, not for the default class.
        - toolchain: Kubernetes/YAML
          description: Size the database's volume, and name its StorageClass.
          whereResource: "ConfigHub.ResourceType = 'apps/v1/StatefulSet' AND ConfigHub.ResourceNameWithoutScope = 'confighub-postgres'"
          invocations:
            - name: set-yq
              args:
                - |
                  .spec.volumeClaimTemplates[0].spec.resources.requests.storage = {{ printf "%q" .Inputs.storage_size }}
                  {{- if .Inputs.storage_class }}
                  | .spec.volumeClaimTemplates[0].spec.storageClassName = {{ printf "%q" .Inputs.storage_class }}
                  {{- end }}
    - name: keycloak
      path: components/keycloak
      description: |
        Keycloak in the install namespace, for evaluation, so that people sign
        in as themselves; the bootstrap administrator's key keeps working. The
        server authenticates to it with KEYCLOAK_CLIENT_PRIVATE_KEY_JWK in
        confighub-secret-env, whose public half is the keycloak_client_jwks
        input, and Keycloak reads its own admin's password from
        confighub-keycloak-secret. After it imports the realm, the organization
        claim has to be told to carry ids, which the realm can't say: see the
        README.
      transformers:
        - toolchain: Kubernetes/YAML
          description: Tell the server where a browser reaches Keycloak.
          whereResource: "ConfigHub.ResourceNameWithoutScope = 'confighub-env'"
          invocations:
            - name: set-string-path
              args: [v1/ConfigMap, data.KEYCLOAK_AUTH_URL, "{{ or .Inputs.keycloak_url \"confighubplaceholder\" }}"]
            - name: set-string-path
              args: [v1/ConfigMap, data.CONFIGHUB_AUTH_ISSUER, "{{ if .Inputs.keycloak_url }}{{ .Inputs.keycloak_url }}/realms/confighub{{ else }}confighubplaceholder{{ end }}"]
        - toolchain: Kubernetes/YAML
          description: Tell Keycloak the address it issues tokens as.
          whereResource: "ConfigHub.ResourceNameWithoutScope = 'confighub-keycloak'"
          invocations:
            - name: set-string-path
              args: [apps/v1/StatefulSet, "spec.template.spec.containers.?name=keycloak.env.?name=KC_HOSTNAME.value", "{{ or .Inputs.keycloak_url \"confighubplaceholder\" }}"]
        # The realm is JSON in the ConfigMap, so it is parsed, edited and
        # written back.
        - toolchain: Kubernetes/YAML
          description: |
            Give the realm the server's public key, the UI's address and the
            organization's email domain.
          whereResource: "ConfigHub.ResourceNameWithoutScope = 'confighub-keycloak-realm'"
          invocations:
            - name: set-yq
              args:
                - |
                  .data["confighub-realm.json"] |= (from_json
                    | .sslRequired = {{ printf "%q" .Inputs.keycloak_ssl_required }}
                    | .organizations[0].domains[0].name = {{ printf "%q" .Inputs.keycloak_org_domain }}
                    | (.clients[] | select(.clientId == "confighub") | .attributes["jwks.string"]) = {{ printf "%q" (or .Inputs.keycloak_client_jwks "confighubplaceholder") }}
                    | (.clients[] | select(.clientId == "confighub-ui") | .redirectUris) = [{{ if .Inputs.ui_url }}{{ printf "%q" (print .Inputs.ui_url "/") }}{{ else }}"confighubplaceholder"{{ end }}]
                    | (.clients[] | select(.clientId == "confighub-ui") | .webOrigins) = [{{ printf "%q" (or .Inputs.ui_url "confighubplaceholder") }}]
                    | to_json(2))
    - name: nodeport
      path: components/nodeport
      conflicts: [traefik]
      description: |
        Publish the API, the OCI registry, the UI and, with the keycloak
        component, Keycloak on NodePorts, as a local cluster that maps them to
        the host wants. The server advertises the
        registry on its NodePort, unless oci_url says where it is.
      transformers:
        - toolchain: Kubernetes/YAML
          whereResource: "ConfigHub.ResourceNameWithoutScope = 'confighub-api'"
          invocations:
            - name: set-int-path
              args: [v1/Service, "spec.ports.?name=http.nodePort", "{{ .Inputs.api_node_port }}"]
        - toolchain: Kubernetes/YAML
          whereResource: "ConfigHub.ResourceNameWithoutScope = 'confighub-oci-server'"
          invocations:
            - name: set-int-path
              args: [v1/Service, "spec.ports.?name=oci.nodePort", "{{ .Inputs.oci_node_port }}"]
        - toolchain: Kubernetes/YAML
          whereResource: "ConfigHub.ResourceNameWithoutScope = 'confighub-ui'"
          invocations:
            - name: set-int-path
              args: [v1/Service, "spec.ports.?name=http.nodePort", "{{ .Inputs.ui_node_port }}"]
        # Empty with oci_url: the server reads OCI_EXTERNAL_PORT as an
        # override of the URL's port, so the NodePort would put the URL's host
        # on a port only the nodes answer. Empty is unset to the server.
        - toolchain: Kubernetes/YAML
          whereResource: "ConfigHub.ResourceNameWithoutScope = 'confighub-env'"
          invocations:
            - name: set-string-path
              args: [v1/ConfigMap, data.OCI_EXTERNAL_PORT, "{{ if not .Inputs.oci_url }}{{ .Inputs.oci_node_port }}{{ end }}"]
        # With the keycloak component, Keycloak too, since a browser signs in
        # there.
        - toolchain: Kubernetes/YAML
          whereResource: "ConfigHub.ResourceNameWithoutScope = 'confighub-keycloak'"
          invocations:
            - name: set-string-path
              args: [v1/Service, spec.type, NodePort]
            - name: set-int-path
              args: [v1/Service, "spec.ports.?name=http.nodePort", "{{ .Inputs.keycloak_node_port }}"]
    - name: metrics
      path: components/metrics
      description: |
        Annotate the server's pod for Prometheus to scrape /internal/metrics
        on the API's port, 9090, as Prometheus's pod discovery and most charts
        that install it read the prometheus.io annotations. The server serves
        the metrics either way, and only inside the cluster: the traefik
        component does not route /internal.
    - name: traefik
      path: components/traefik
      description: |
        Route the API through Traefik on a hostname, redirecting HTTP to
        HTTPS. /internal, which carries the liveness check, is not routed.
      externalRequires:
        - kind: CRD
          name: ingressroutes.traefik.io
      transformers:
        - toolchain: Kubernetes/YAML
          whereResource: "ConfigHub.ResourceType = 'traefik.io/v1alpha1/IngressRoute'"
          invocations:
            - name: set-yq
              args: ['.spec.routes[].match |= sub("confighubplaceholder"; "{{ or .Inputs.host "confighubplaceholder" }}")']

  # The addresses are where a browser reaches the API and the UI, which are
  # served from different origins. Unset, each is confighubplaceholder, which a
  # deployment must set first.
  inputs:
    - name: api_url
      type: string
      default: ""
      prompt: URL a browser reaches the ConfigHub API on
      description: |
        The UI calls the API from the browser, so this is the browser's
        address for it, not a cluster-internal one.
    - name: ui_url
      type: string
      default: ""
      prompt: URL a browser reaches the ConfigHub UI on
      description: |
        The server advertises it in /api/info, which is how `cub auth
        browser-session` finds the UI.
    - name: oci_url
      type: string
      default: ""
      prompt: URL to advertise the OCI registry at, or blank to derive it from each request
      description: |
        OCI_EXTERNAL_URL: the scheme, host and port the server advertises the
        OCI registry at, like https://oci.example.com, an http or https URL
        with no path whose port defaults to its scheme's. Empty, the server
        derives them from the client's request. Set it behind a load balancer
        that terminates TLS without forwarded headers, or for a registry on a
        name other than oci.<API host>.
    - name: admin_jwk
      type: string
      default: ""
      prompt: Public JWK of the bootstrap administrator
      description: |
        The public half of the key the first administrator signs in with, as
        `cub server key admin` prints it. Not a secret: the private half never
        reaches the cluster.
    - name: api_node_port
      type: int
      default: 32180
      prompt: NodePort for the API (nodeport component)
    - name: oci_node_port
      type: int
      default: 32181
      prompt: NodePort for the OCI registry (nodeport component)
    - name: ui_node_port
      type: int
      default: 32183
      prompt: NodePort for the UI (nodeport component)
    - name: host
      type: string
      default: ""
      prompt: Hostname Traefik routes to the API (traefik component)
    - name: storage_class
      type: string
      default: ""
      prompt: StorageClass for the database's volume, or blank for the cluster's default (bundled-postgres component)
      description: |
        The storageClassName of the bundled database's volume claim. Empty
        leaves it unset, so the cluster's default StorageClass provisions it;
        on a cluster with none, such as EKS Auto Mode, name one, or the claim
        stays Pending and the database never starts.
    - name: storage_size
      type: string
      default: 10Gi
      prompt: Size of the database's volume (bundled-postgres component)
    - name: keycloak_url
      type: string
      default: ""
      prompt: URL a browser reaches Keycloak on, without a trailing slash (keycloak component)
      description: |
        The issuer of every token Keycloak mints, so it has to be the address
        people really use.
    - name: keycloak_client_jwks
      type: string
      default: ""
      prompt: Public JWKS of the server's Keycloak client key (keycloak component)
      description: |
        The public half of KEYCLOAK_CLIENT_PRIVATE_KEY_JWK, as `cub server key
        keycloak-client` prints it. Keycloak imports it with the realm, on its
        first start only.
    - name: keycloak_node_port
      type: int
      default: 32182
      prompt: NodePort for Keycloak (keycloak and nodeport components)
    - name: keycloak_org_domain
      type: string
      default: confighub.local
      prompt: Email domain of the organization users join (keycloak component)
      description: |
        Keycloak requires an organization to have one, and offers membership to
        users whose email matches it. The default is one nobody owns.
    - name: keycloak_ssl_required
      type: string
      default: none
      prompt: The realm's sslRequired, none or external (keycloak component)
      description: |
        none for a Keycloak reached over plain http, as on a laptop; external
        for one behind TLS.

  transformers:
    - toolchain: Kubernetes/YAML
      description: Put ConfigHub in the install namespace.
      invocations:
        - name: set-namespace
          args: ["{{ .Namespace }}", confighubplaceholder]
    - toolchain: Kubernetes/YAML
      description: |
        Tell the server where a browser reaches the UI and where clients reach
        the OCI registry, and name the bootstrap administrator's key.
      whereResource: "ConfigHub.ResourceNameWithoutScope = 'confighub-env'"
      invocations:
        - name: set-string-path
          args: [v1/ConfigMap, data.CONFIGHUB_UI_URL, "{{ or .Inputs.ui_url \"confighubplaceholder\" }}"]
        # Empty, not a placeholder, when unset: the server reads empty as
        # unset, and refuses to start with anything here but a URL.
        - name: set-string-path
          args: [v1/ConfigMap, data.OCI_EXTERNAL_URL, "{{ .Inputs.oci_url }}"]
        - name: set-string-path
          args: [v1/ConfigMap, data.CONFIGHUB_LOCAL_ADMIN_JWK, "{{ or .Inputs.admin_jwk \"confighubplaceholder\" }}"]
    - toolchain: Kubernetes/YAML
      description: Tell the UI where a browser reaches the API.
      whereResource: "ConfigHub.ResourceNameWithoutScope = 'confighub-ui-env'"
      invocations:
        - name: set-string-path
          args: [v1/ConfigMap, data.CONFIGHUB_URL, "{{ or .Inputs.api_url \"confighubplaceholder\" }}"]

  validators:
    - toolchain: Kubernetes/YAML
      invocations:
        - name: vet-schemas
        - name: vet-merge-keys
        - name: vet-format
        # A tag must be pinned: no :latest, and no untagged image, which means
        # latest. A colon counts as a tag only in the last path segment, so a
        # registry port is not one.
        - name: vet-images
          args: ['{"DenyRegexp": "(:latest$)|^([^/]+/)*[^/:@]+$"}']
        - name: vet-pod-security-standard
          args: [restricted]

  # What the server accepts and expects, generated from the image the package
  # runs: its environment variables as a JSON Schema, and its ports, paths and
  # probes. installer doc shows them.
  validation:
    envSchema: validation/env.schema.json
    runtimeSpec: validation/runtime.yaml
    howToRegenerate: |
      image=ghcr.io/confighubai/confighub:v0.11.2
      docker run --rm --entrypoint /srv/app/confighub $image docgen env > validation/env.schema.json
      docker run --rm --entrypoint /srv/app/confighub $image docgen runtime > validation/runtime.yaml
