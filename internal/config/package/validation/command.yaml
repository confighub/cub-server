---
name: confighub identity provider create
synopsis: create an Identity Provider
description: create a SAML Identity Provider in Keycloak
usage: confighub identity provider create [flags]
options:
    - name: alias
      usage: the alias name of the Identity provider
    - name: external-org-id
      usage: the ID of the Organization to attach this provider to
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for create
    - name: url
      usage: the SSO URL of the provider
see_also:
    - confighub identity provider - Manage SAML identity providers
---
name: confighub identity provider create-ldap
synopsis: create an Identity Provider using LDAP or AD
description: |
    create an Identity Provider using LDAP or Active Directory to be synced with Keycloak
usage: confighub identity provider create-ldap [flags]
options:
    - name: bind-cred
      usage: the password for the bind DN user
    - name: bind-dn
      usage: |
        the distinguished name of a user with read access, example: 'CN=Administrator,CN=Users,DC=example,DC=com'
    - name: cache-policy
      default_value: DEFAULT
      usage: |
        caching policy, one of: DEFAULT, EVICT_DAILY, EVICT_WEEKLY, MAX_LIFESPAN, NO_CACHE
    - name: conn-pooling
      default_value: "false"
      usage: use connection pooling if enabled
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for create-ldap
    - name: kerberos
      default_value: "false"
      usage: use Kerberos for password authentication
    - name: name
      usage: a unique name for the LDAP IDP
    - name: read-only
      default_value: "true"
      usage: |
        whether Keycloak should write back to the LDAP server or only read
    - name: search-filter
      default_value: (sAMAccountName=*)
      usage: a filter to narrow down the users in the DN
    - name: start-tls
      default_value: "false"
      usage: |
        use startTLS if enabled, cannot be used with connection pooling
    - name: trust-email
      default_value: "false"
      usage: |
        automatically trust emails without verification from LDAP server if true
    - name: trust-store-spi
      default_value: "true"
      usage: use LDAP connections with Truststore SPI
    - name: url
      usage: |
        url of the LDAP server to connect to, should start with 'ldap://'
    - name: use-krb-password
      default_value: "false"
      usage: password for Kerberos
    - name: user-dn
      usage: |
        the distinguished name users are stored under, example: 'OU=Users,DC=example,DC=com'
    - name: validate-password-policy
      default_value: "false"
      usage: Keycloak will valid the password policu if true
    - name: vendor
      default_value: ad
      usage: either 'ad' for Active Directory, or 'other'
see_also:
    - confighub identity provider - Manage SAML identity providers
