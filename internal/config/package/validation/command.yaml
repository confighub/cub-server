name: confighub
synopsis: ConfigHub server and admin tool
description: ConfigHub server and admin tool
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for confighub
see_also:
    - confighub access - Manage access control via IDP metadata
    - confighub admin - Administer Organizations, Users, and quota directly in the database
    - confighub completion - Generate the autocompletion script for the specified shell
    - confighub db - database migrations
    - confighub docgen - Generate documentation of the server
    - confighub identity - Manage Confighub Organizations and Users
    - confighub jwt - JWT key management commands
    - confighub openapi-spec - Generate OpenAPI spec
    - confighub serve - Start the ConfigHub server
---
name: confighub access
synopsis: Manage access control via IDP metadata
description: |-
    Manage access control by setting IDP metadata on organizations.

    Access is controlled via the "confighub_instance_access" metadata field which can be:
      - "all" - grants access to all instances
      - "us-west-1,eu-central-1" - comma-separated list of specific instances

    Examples:
      # Grant user access by email (creates personal org if needed)
      confighub access grant --user user@example.com --instance all

      # Grant user access by ID
      confighub access grant --user user_abc123 --instance us-west-1

      # Grant org access
      confighub access grant --org org_xyz789 --instance all

      # Revoke org access
      confighub access revoke --org org_xyz789

      # Show user info and org memberships
      confighub access get --user user@example.com

      # Show org info and access status
      confighub access get --org org_xyz789
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for access
see_also:
    - confighub - ConfigHub server and admin tool
    - confighub access get - Show access information for a user or organization
    - confighub access grant - Grant access to an instance for a user or organization
    - confighub access revoke - Revoke access by removing instance metadata from an organization
---
name: confighub access get
synopsis: Show access information for a user or organization
description: |-
    Show access information by querying the identity provider.

    For users: shows all organizations the user is a member of and their access status
    For organizations: shows organization details and access metadata

    Examples:
      # Show user info by email
      confighub access get --user user@example.com

      # Show user info by ID
      confighub access get --user user_abc123

      # Show org info
      confighub access get --org org_xyz789
usage: confighub access get [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for get
    - name: org
      usage: IDP organization ID
    - name: user
      usage: IDP user ID or email address
see_also:
    - confighub access - Manage access control via IDP metadata
---
name: confighub access grant
synopsis: Grant access to an instance for a user or organization
description: |-
    Grant access to an instance by setting identity provider metadata.

    Specify either --user or --org (mutually exclusive):
      --user can be an IDP user ID or email address
      --org must be an IDP organization ID

    Examples:
      # Grant user access by email
      confighub access grant --user user@example.com --instance all

      # Grant user access by ID
      confighub access grant --user user_abc123 --instance us-west-1

      # Grant org access
      confighub access grant --org org_xyz789 --instance all
usage: confighub access grant [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for grant
    - name: instance
      usage: Instance ID or 'all' for all instances
    - name: org
      usage: IDP organization ID
    - name: user
      usage: IDP user ID or email address
see_also:
    - confighub access - Manage access control via IDP metadata
---
name: confighub access revoke
synopsis: |
    Revoke access by removing instance metadata from an organization
description: |-
    Revoke access by removing the "confighub_instance_access" metadata from an organization.

    Example:
      confighub access revoke --org org_xyz789
usage: confighub access revoke [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for revoke
    - name: org
      usage: IDP organization ID
see_also:
    - confighub access - Manage access control via IDP metadata
---
name: confighub admin
synopsis: |
    Administer Organizations, Users, and quota directly in the database
description: |-
    Administer Organizations, Users, and quota directly in the database.

    These commands act on any Organization, including ones the operator is not a
    member of, which is why they are not exposed through the API or the cub CLI.
    They read DATABASE_URL from the environment the same way `serve` does.

    Every command that writes resolves and prints its target first, and every one
    of them accepts --dry-run.

    An Organization is named by exactly one of --slug, --organization-id, or
    --external-id; a User by exactly one of --username, --slug, --user-id, or
    --external-id. Which kind of identifier a value is has to be stated rather than
    guessed: ConfigHub IDs and identity-provider IDs are both UUIDs, and nothing
    about the value itself says which namespace it belongs to.

    Examples:
      # Who is currently cut off?
      confighub admin user list --suspended
      confighub admin org list --disabled

      # Cut off one user immediately (sets users.disabled and suspends)
      confighub admin user disable --username jane@example.com --reason "incident 4312"

      # Let them back in
      confighub admin user enable --username jane@example.com

      # Turn an Organization off and back on
      confighub admin org disable --slug acme-corp
      confighub admin org enable --slug acme-corp

      # Delete an Organization (soft: disabled and hidden, rows kept)
      confighub admin org delete --slug acme-corp
      confighub admin org list --deleted

      # Review and raise a limit
      confighub admin quota list --slug acme-corp
      confighub admin quota set --slug acme-corp --entity-type Space --max 500
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for admin
see_also:
    - confighub - ConfigHub server and admin tool
    - confighub admin local-admin-key - Generate the bootstrap administrator's keypair
    - confighub admin org - Inspect, disable, enable, and delete Organizations
    - confighub admin quota - Review and change per-Organization entity limits
    - confighub admin user - Inspect, disable, and enable Users
---
name: confighub admin local-admin-key
synopsis: Generate the bootstrap administrator's keypair
description: |-
    Generate the keypair for the local administrator of an instance with no
    identity provider.

    The public half goes in CONFIGHUB_LOCAL_ADMIN_JWK, which the server reads at
    startup to create the administrator and register the key. The private half is
    written locally and never sent anywhere.

    Run this before starting the server: the server needs the public key to have an
    administrator at all, so there is no way to obtain one through the API first.

    An existing private key is never overwritten. With --reuse, the public half of the
    key already there is printed instead. That is how several servers sharing one
    database keep one administrator key: on every start the server makes whatever
    CONFIGHUB_LOCAL_ADMIN_JWK names the administrator's bootstrap key, replacing the
    previous one.

    Examples:
      confighub admin local-admin-key
      confighub admin local-admin-key --key ./bootstrap.jwk
      confighub admin local-admin-key --reuse
usage: confighub admin local-admin-key [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for local-admin-key
    - name: key
      default_value: local-admin
      usage: |
        alias under cub's key directory, or a path, to write the private key to
    - name: reuse
      default_value: "false"
      usage: |
        if the private key already exists, print its public half instead of failing
see_also:
    - confighub admin - Administer Organizations, Users, and quota directly in the database
---
name: confighub admin org
synopsis: Inspect, disable, enable, and delete Organizations
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for org
see_also:
    - confighub admin - Administer Organizations, Users, and quota directly in the database
    - 'confighub admin org delete - Delete an Organization (soft: disabled and hidden, rows kept)'
    - confighub admin org disable - Disable an Organization
    - confighub admin org enable - Enable an Organization
    - confighub admin org get - Show one Organization
    - confighub admin org list - List Organizations
---
name: confighub admin org delete
synopsis: |
    Delete an Organization (soft: disabled and hidden, rows kept)
description: |-
    Delete an Organization.

    This is a soft delete. The Organization is disabled, so it cannot mint new
    tokens, and it is hidden with the reason
    Deleted, so it is left out of listings. Every row it owns stays in the database,
    and nothing is unapplied from any Target. `org list --deleted` finds what has
    been deleted this way; removing the rows for good is a separate, later step.

    The identity provider is not touched: delete the Organization there with
    `confighub identity orgs delete` if that is wanted too.

    Example:
      confighub admin org delete --external-id 80596f26-75a7-427e-8373-76151beeec9a
usage: confighub admin org delete [flags]
options:
    - name: dry-run
      default_value: "false"
      usage: Resolve and report what would change without writing
    - name: external-id
      usage: Organization ID at the identity provider
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for delete
    - name: organization-id
      usage: ConfigHub OrganizationID (UUID)
    - name: slug
      usage: Organization Slug
see_also:
    - confighub admin org - Inspect, disable, enable, and delete Organizations
---
name: confighub admin org disable
synopsis: Disable an Organization
description: |-
    Disable an Organization.

    A disabled Organization cannot mint new tokens. Nothing belonging to the Organization is deleted or unapplied.

