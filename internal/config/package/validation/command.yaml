---
name: confighub completion bash
synopsis: Generate the autocompletion script for bash
description: |
    Generate the autocompletion script for the bash shell.

    This script depends on the 'bash-completion' package.
    If it is not installed already, you can install it via your OS's package manager.

    To load completions in your current shell session:

    	source <(confighub completion bash)

    To load completions for every new session, execute once:

    #### Linux:

    	confighub completion bash > /etc/bash_completion.d/confighub

    #### macOS:

    	confighub completion bash > $(brew --prefix)/etc/bash_completion.d/confighub

    You will need to start a new shell for this setup to take effect.
usage: confighub completion bash
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for bash
    - name: no-descriptions
      default_value: "false"
      usage: disable completion descriptions
see_also:
    - confighub completion - Generate the autocompletion script for the specified shell
---
name: confighub completion fish
synopsis: Generate the autocompletion script for fish
description: |
    Generate the autocompletion script for the fish shell.

    To load completions in your current shell session:

    	confighub completion fish | source

    To load completions for every new session, execute once:

    	confighub completion fish > ~/.config/fish/completions/confighub.fish

    You will need to start a new shell for this setup to take effect.
usage: confighub completion fish [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for fish
    - name: no-descriptions
      default_value: "false"
      usage: disable completion descriptions
see_also:
    - confighub completion - Generate the autocompletion script for the specified shell
---
name: confighub completion powershell
synopsis: Generate the autocompletion script for powershell
description: |
    Generate the autocompletion script for powershell.

    To load completions in your current shell session:

    	confighub completion powershell | Out-String | Invoke-Expression

    To load completions for every new session, add the output of the above command
    to your powershell profile.
usage: confighub completion powershell [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for powershell
    - name: no-descriptions
      default_value: "false"
      usage: disable completion descriptions
see_also:
    - confighub completion - Generate the autocompletion script for the specified shell
---
name: confighub completion zsh
synopsis: Generate the autocompletion script for zsh
description: |
    Generate the autocompletion script for the zsh shell.

    If shell completion is not already enabled in your environment you will need
    to enable it.  You can execute the following once:

    	echo "autoload -U compinit; compinit" >> ~/.zshrc

    To load completions in your current shell session:

    	source <(confighub completion zsh)

    To load completions for every new session, execute once:

    #### Linux:

    	confighub completion zsh > "${fpath[1]}/_confighub"

    #### macOS:

    	confighub completion zsh > $(brew --prefix)/share/zsh/site-functions/_confighub

    You will need to start a new shell for this setup to take effect.
usage: confighub completion zsh [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for zsh
    - name: no-descriptions
      default_value: "false"
      usage: disable completion descriptions
see_also:
    - confighub completion - Generate the autocompletion script for the specified shell
