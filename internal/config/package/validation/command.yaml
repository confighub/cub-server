name: confighub admin quota
synopsis: Review and change per-Organization entity limits
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for quota
see_also:
    - confighub admin - Administer Organizations, Users, and quota directly in the database
    - confighub admin quota list - Show quota limits and usage for an Organization
    - confighub admin quota set - Change the maximum for one entity type in an Organization
---
name: confighub admin quota list
synopsis: Show quota limits and usage for an Organization
description: |-
    Show quota limits and usage for an Organization.

    Two counts are reported per entity type:

      In Use    a live COUNT(*) of the entities that exist right now.
      Tracked   the counter the quota row carries, which is what enforcement
                actually compares against Max. It is maintained incrementally on
                every create and delete.

    They should agree. Where they do not, the row is marked and enforcement is going
    by the tracked count, not by reality.

    Example:
      confighub admin quota list --slug acme-corp
usage: confighub admin quota list [flags]
options:
    - name: external-id
      usage: Organization ID at the identity provider
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for list
    - name: organization-id
      usage: ConfigHub OrganizationID (UUID)
    - name: slug
      usage: Organization Slug
see_also:
    - confighub admin quota - Review and change per-Organization entity limits
---
name: confighub admin quota set
synopsis: Change the maximum for one entity type in an Organization
description: |-
    Change the maximum for one entity type in an Organization.

    Lowering Max below the current count is allowed: it blocks new entities without
    touching the ones that exist. Nothing is deleted either way.

    Run `confighub admin quota list` first to see the entity types this Organization
    has rows for.

    Example:
      confighub admin quota set --slug acme-corp --entity-type Space --max 500
usage: confighub admin quota set [flags]
options:
    - name: dry-run
      default_value: "false"
      usage: Resolve and report what would change without writing
    - name: entity-type
      usage: Entity type to change, e.g. Space or Unit (required)
    - name: external-id
      usage: Organization ID at the identity provider
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for set
    - name: max
      default_value: "0"
      usage: New maximum for that entity type (required)
    - name: organization-id
      usage: ConfigHub OrganizationID (UUID)
    - name: slug
      usage: Organization Slug
see_also:
    - confighub admin quota - Review and change per-Organization entity limits
---
name: confighub admin user
synopsis: Inspect, disable, and enable Users
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for user
see_also:
    - confighub admin - Administer Organizations, Users, and quota directly in the database
    - confighub admin user disable - Disable and suspend a User
    - confighub admin user enable - Enable and reinstate a User
    - confighub admin user get - Show one User
    - confighub admin user list - List Users
---
name: confighub admin user disable
synopsis: Disable and suspend a User
description: |-
    Disable and suspend a User.

    This does both halves of cutting a user off, in one transaction, because either
    one alone leaves a hole:

      users.disabled       blocks new logins and token refreshes, but is read from
                           claims written at mint time, so a token already issued
                           keeps working until it expires.
      suspended_users      is checked against a set each running replica refreshes on
                           an interval, so it takes effect within that interval no
                           matter what token the caller holds. It is also re-checked
                           at mint time, so a user re-enabled at the identity
                           provider is still refused while the row exists.

    --reason is required. The row it writes is what a colleague reads at 3am to find
    out whether they can undo this.

    Example:
      confighub admin user disable --username jane@example.com --reason "incident 4312"
usage: confighub admin user disable [flags]
options:
    - name: by
      usage: |
        Who is doing this; recorded in suspended_users (defaults to $CONFIGHUB_ADMIN_OPERATOR, then the invoking OS user)
    - name: dry-run
      default_value: "false"
      usage: Resolve and report what would change without writing
    - name: external-id
      usage: User ID at the identity provider
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for disable
    - name: reason
      usage: |
        Why this user is being cut off; recorded in suspended_users (required)
    - name: slug
      usage: User Slug
    - name: user-id
      usage: ConfigHub UserID (UUID)
    - name: username
      usage: Username, which is the user's email address
see_also:
    - confighub admin user - Inspect, disable, and enable Users
---
name: confighub admin user enable
synopsis: Enable and reinstate a User
description: |-
    Enable and reinstate a User.

    This reverses `admin user disable`: it clears users.disabled and deletes the
    suspended_users row, in one transaction. Deleting that row is the only way to
    reinstate a suspended user.

    Example:
      confighub admin user enable --username jane@example.com
usage: confighub admin user enable [flags]
options:
    - name: dry-run
      default_value: "false"
      usage: Resolve and report what would change without writing
    - name: external-id
      usage: User ID at the identity provider
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for enable
    - name: slug
      usage: User Slug
    - name: user-id
      usage: ConfigHub UserID (UUID)
    - name: username
      usage: Username, which is the user's email address
see_also:
    - confighub admin user - Inspect, disable, and enable Users
---
name: confighub admin user get
synopsis: Show one User
description: |-
    Show one User.

    Example:
      confighub admin user get --username jane@example.com
usage: confighub admin user get [flags]
options:
    - name: external-id
      usage: User ID at the identity provider
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for get
    - name: slug
      usage: User Slug
    - name: user-id
