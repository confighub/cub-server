---
name: confighub admin user list
synopsis: List Users
description: |-
    List Users, most recently created first.

    --suspended is the one to reach for mid-incident: it lists exactly who is cut
    off right now, with the reason and the operator who did it.

    Examples:
      confighub admin user list --suspended
      confighub admin user list --disabled
usage: confighub admin user list [flags]
options:
    - name: disabled
      default_value: "false"
      usage: Only list Users with Disabled set
    - name: help
      shorthand: h
      default_value: "false"
